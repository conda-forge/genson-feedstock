{% set version = "1.3.0" %}

package:
  name: genson
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/g/genson/genson-{{ version }}.tar.gz
  sha256: e02db9ac2e3fd29e65b5286f7135762e2cd8a986537c075b06fc5f1517308e37

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv ."
  entry_points:
    - genson = genson.cli:main

requirements:
  host:
    - python
    - wheel
    - pip

  run:
    - python

test:
  imports:
    - genson
    - unittest
  requires:
    - pip

  commands:
    - pip check
    - python -m unittest discover test

about:
  home: https://github.com/wolverdude/genson/
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: 'GenSON is a powerful, user-friendly JSON Schema generator.'
  dev_url: https://github.com/wolverdude/genson/
  doc_source_url: https://github.com/wolverdude/GenSON/blob/v1.3.0/README.rst
  description: GenSON is a powerful, user-friendly JSON Schema generator built in Python.

extra:
  recipe-maintainers:
    - pmlandwehr
